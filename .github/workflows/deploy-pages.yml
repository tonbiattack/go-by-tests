name: Deploy Go by Tests to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Verify Go formatting
        run: test -z "$(gofmt -d $(find examples -type f -name '*.go' -print))"
      - name: Run Go tests
        run: go test ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: GITHUB_ACTIONS=true pnpm build
      - name: Verify GitHub Pages links
        run: GITHUB_PAGES_BASE=/go-by-tests pnpm verify:links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
